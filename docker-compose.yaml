services:
  backend:
    build: .
    container_name: cryptohelper
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./config/env_file.env 
    volumes:
      - logs:/app/log
    networks:
      - cryptonet

  redis:
    image: redis:latest
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cryptonet

volumes:
    logs:

networks:
    cryptonet:
     driver: bridge
