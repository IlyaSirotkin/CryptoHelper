version: 'version'
services:
  backend:
    build: .
    container_name: cryptohelper
    depends_on:
      - redis
    volumes:
      - logs: /.log/log
    networks:
      - cryptonet

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - cryptonet

volumes:
    logs:

networks:
    cryptonet:
     driver: bridge
